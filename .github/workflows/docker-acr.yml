name: Build and Push to Tencent TCR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAMESPACE: msut
  IMAGE_NAME: msut-web
  BUILD_CONTEXT: .
  DOCKERFILE: ./Dockerfile
  PLATFORMS: linux/amd64

jobs:
  pr-build-and-push:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose IMAGE env
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Login to Tencent TCR
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build (and push if not fork PR)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event.pull_request.head.repo.fork == false }}
          tags: |
            ${{ env.IMAGE }}:pr-${{ github.event.number }}
            ${{ env.IMAGE }}:pr-${{ github.event.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-on-main:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose IMAGE env
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
